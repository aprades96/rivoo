spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Dummy URI — never contacted during persistence-layer tests.
          # SecurityConfig is @ConditionalOnProperty on this key, so it
          # must be present to enable the SecurityFilterChain bean wiring
          # (InternalEndpointFilter, KeycloakJwtConverter).
          jwk-set-uri: http://localhost:9999/realms/rivoo/protocol/openid-connect/certs

rivoo:
  security:
    internal-service-key: test-internal-key
  services:
    staff-service:
      url: http://localhost:9999
    client-service:
      url: http://localhost:9999
    billing-service:
      url: http://localhost:9999
    notification-service:
      url: http://localhost:9999
    salon-service:
      url: http://localhost:9999
