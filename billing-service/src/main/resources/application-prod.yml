spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

rivoo:
  security:
    internal-service-key: ${RIVOO_SECURITY_INTERNAL_SERVICE_KEY}
  services:
    auth-service:
      url: ${RIVOO_SERVICES_AUTH_SERVICE_URL}
    salon-service:
      url: ${RIVOO_SERVICES_SALON_SERVICE_URL}
  billing:
    # Debe apuntar al dominio real del frontend en produccion. El default solo
    # existe para que un despliegue sin la variable arranque igualmente (el usuario
    # volveria a localhost al salir del portal, pero el servicio no se cae).
    portal-return-url: ${RIVOO_BILLING_PORTAL_RETURN_URL:http://localhost:3000/settings/billing}
  stripe:
    api-key: ${STRIPE_API_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
