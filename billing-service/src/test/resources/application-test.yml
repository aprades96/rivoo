spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/realms/rivoo/protocol/openid-connect/certs

rivoo:
  security:
    internal-service-key: test-internal-key
  services:
    auth-service:
      url: http://localhost:9999
    salon-service:
      url: http://localhost:9999
