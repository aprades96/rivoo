services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"    # 3307 en host para no colisionar con MySQL local (3306)
    volumes:
      - ./infrastructure/mysql/init-local.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.6
    command: start-dev --import-realm
    environment:
      KC_HTTP_PORT: 9080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9080:9080"
    volumes:
      - ./infrastructure/keycloak/rivoo-realm.json:/opt/keycloak/data/import/rivoo-realm.json
      - ./infrastructure/keycloak/themes/rivoo:/opt/keycloak/themes/rivoo
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9080 && echo -e 'GET /realms/rivoo HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy

  keycloak-init:
    image: curlimages/curl:latest
    volumes:
      - ./infrastructure/keycloak/rivoo-user-profile.json:/opt/keycloak/rivoo-user-profile.json
      - ./infrastructure/keycloak/setup-user-profile.sh:/opt/keycloak/setup-user-profile.sh
    environment:
      KEYCLOAK_URL: http://keycloak:9080
    entrypoint: ["sh", "/opt/keycloak/setup-user-profile.sh"]
    depends_on:
      keycloak:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9080/realms/rivoo/protocol/openid-connect/certs
      RIVOO_SECURITY_INTERNAL_SERVICE_KEY: rivoo-dev-internal-key-2026
      RIVOO_KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:9080
      RIVOO_KEYCLOAK_ADMIN_REALM: rivoo
      RIVOO_KEYCLOAK_ADMIN_CLIENT_ID: salon-admin-cli
      RIVOO_KEYCLOAK_ADMIN_CLIENT_SECRET: rivoo-admin-cli-secret-dev
    depends_on:
      mysql:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully

  salon-service:
    build:
      context: .
      dockerfile: salon-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/salon_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9080/realms/rivoo/protocol/openid-connect/certs
      RIVOO_SECURITY_INTERNAL_SERVICE_KEY: rivoo-dev-internal-key-2026
      RIVOO_SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      RIVOO_SERVICES_BILLING_SERVICE_URL: http://billing-service:8087
      RIVOO_SERVICES_NOTIFICATION_SERVICE_URL: http://notification-service:8086
      # Sin esta variable, el perfil `local` deja la URL en http://localhost:8083, que dentro
      # del contenedor es el propio salon-service: la pagina publica saldria sin empleados ni
      # servicios y solo quedaria un WARN. El binding relajado de Spring hace que la variable
      # tenga precedencia sobre el yml de perfil, que es como lo resuelven los demas servicios.
      RIVOO_SERVICES_STAFF_SERVICE_URL: http://staff-service:8083
    depends_on:
      - auth-service
      - billing-service
      - staff-service

  staff-service:
    build:
      context: .
      dockerfile: staff-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/staff_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9080/realms/rivoo/protocol/openid-connect/certs
      RIVOO_SECURITY_INTERNAL_SERVICE_KEY: rivoo-dev-internal-key-2026
      RIVOO_SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      RIVOO_SERVICES_BILLING_SERVICE_URL: http://billing-service:8087
    depends_on:
      - auth-service

  client-service:
    build:
      context: .
      dockerfile: client-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/client_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9080/realms/rivoo/protocol/openid-connect/certs
      RIVOO_SECURITY_INTERNAL_SERVICE_KEY: rivoo-dev-internal-key-2026
      RIVOO_SERVICES_APPOINTMENT_SERVICE_URL: http://appointment-service:8085
    depends_on:
      mysql:
        condition: service_healthy

  appointment-service:
    build:
      context: .
      dockerfile: appointment-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/appointment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9080/realms/rivoo/protocol/openid-connect/certs
      RIVOO_SECURITY_INTERNAL_SERVICE_KEY: rivoo-dev-internal-key-2026
      RIVOO_SERVICES_STAFF_SERVICE_URL: http://staff-service:8083
      RIVOO_SERVICES_CLIENT_SERVICE_URL: http://client-service:8084
      RIVOO_SERVICES_BILLING_SERVICE_URL: http://billing-service:8087
      RIVOO_SERVICES_NOTIFICATION_SERVICE_URL: http://notification-service:8086
      RIVOO_SERVICES_SALON_SERVICE_URL: http://salon-service:8082
    depends_on:
      - staff-service
      - client-service

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9080/realms/rivoo/protocol/openid-connect/certs
      RIVOO_SECURITY_INTERNAL_SERVICE_KEY: rivoo-dev-internal-key-2026
    depends_on:
      mysql:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/billing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9080/realms/rivoo/protocol/openid-connect/certs
      RIVOO_SECURITY_INTERNAL_SERVICE_KEY: rivoo-dev-internal-key-2026
      RIVOO_SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      RIVOO_SERVICES_SALON_SERVICE_URL: http://salon-service:8082
    depends_on:
      mysql:
        condition: service_healthy

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9080/realms/rivoo/protocol/openid-connect/certs
      RIVOO_SECURITY_INTERNAL_SERVICE_KEY: rivoo-dev-internal-key-2026
      RIVOO_SERVICES_SALON_SERVICE_URL: http://salon-service:8082
      RIVOO_SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      RIVOO_SERVICES_APPOINTMENT_SERVICE_URL: http://appointment-service:8085
      RIVOO_SERVICES_BILLING_SERVICE_URL: http://billing-service:8087
    depends_on:
      - salon-service

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:9080/realms/rivoo/protocol/openid-connect/certs
      RIVOO_SECURITY_INTERNAL_SERVICE_KEY: rivoo-dev-internal-key-2026
      RIVOO_SERVICES_AUTH_SERVICE_URL: http://auth-service:8081
      RIVOO_SERVICES_SALON_SERVICE_URL: http://salon-service:8082
      RIVOO_SERVICES_STAFF_SERVICE_URL: http://staff-service:8083
      RIVOO_SERVICES_CLIENT_SERVICE_URL: http://client-service:8084
      RIVOO_SERVICES_APPOINTMENT_SERVICE_URL: http://appointment-service:8085
      RIVOO_SERVICES_NOTIFICATION_SERVICE_URL: http://notification-service:8086
      RIVOO_SERVICES_BILLING_SERVICE_URL: http://billing-service:8087
      RIVOO_SERVICES_ADMIN_SERVICE_URL: http://admin-service:8088
      RIVOO_SERVICES_KEYCLOAK_URL: http://keycloak:9080
    depends_on:
      - auth-service
      - salon-service
      - staff-service
      - client-service
      - appointment-service
      - notification-service
      - billing-service
      - admin-service

volumes:
  mysql-data:
