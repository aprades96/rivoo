spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

rivoo:
  security:
    internal-service-key: ${RIVOO_SECURITY_INTERNAL_SERVICE_KEY}
  keycloak:
    owner:
      # Production behaviour, stated explicitly rather than inherited: the owner must confirm their
      # address. Only local/test flip this, and only while there is still no SMTP server.
      email-verified-on-creation: false
    admin:
      server-url: ${RIVOO_KEYCLOAK_SERVER_URL}
      realm: ${RIVOO_KEYCLOAK_REALM}
      client-id: ${RIVOO_KEYCLOAK_CLIENT_ID}
      client-secret: ${RIVOO_KEYCLOAK_CLIENT_SECRET}
