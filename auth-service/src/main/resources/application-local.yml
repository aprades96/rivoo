spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: rivoo
    password: rivoo123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9080/realms/rivoo/protocol/openid-connect/certs

rivoo:
  security:
    internal-service-key: rivoo-dev-internal-key-2026
  keycloak:
    owner:
      # Only here because there is no SMTP server yet: notification-service's MailStubAdapter just
      # logs, and rivoo-realm.json has no smtpServer block -- and it is Keycloak, not the app, that
      # mails the verification link. Without this the owner never gets a link and can never log in.
      # Set it back to false as soon as SMTP is configured, so the owner receives a real
      # confirmation email.
      email-verified-on-creation: true
    admin:
      server-url: http://localhost:9080
      realm: rivoo
      client-id: salon-admin-cli
      client-secret: rivoo-admin-cli-secret-dev
